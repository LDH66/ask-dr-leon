<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Dr. Leon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header / Voice Toggle -->
        <header class="app-header">
            <h1>Ask Dr. Leon</h1>
            <button id="voiceToggleBtn" class="voice-toggle-btn">Voice: Generic</button>
        </header>

        <!-- Main Content / Visual Area -->
        <main class="chat-main">
            <div id="listeningIndicator" class="listening-indicator" style="display: none;">Listening...</div>
            <div id="topicPills" class="topic-pills">
                <!-- Dynamically populated by script.js -->
            </div>
        </main>

        <!-- Footer / Input Area -->
        <footer class="chat-footer">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask Dr. Leon about vibe coding...">
                <button id="micBtn" class="control-btn" title="Voice Input" style="display: none;">🎤</button>
                <button id="submitBtn" class="control-btn" title="Send">➤</button>
                <button id="stopAudioBtn" class="control-btn" title="Stop Audio">⏹</button>
            </div>
        </footer>
    </div>

    <!-- Script with cache-buster -->
    <script src="js/script.js?v=2.0"></script>
</body>
</html>
