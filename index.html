<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ask Dr Leon - Vibe Coding</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <!-- PANE 1: Title Pane (Subtitle removed) -->
        <header class="pane title-pane">
            <div class="logo-area">
                <span class="status-dot"></span>
                <h1>Ask Dr Leon</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button id="mediaModeBtn" class="voice-toggle-btn leon-active" style="padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer;">Mode: Video</button>
                <button class="menu-btn" aria-label="Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
            </div>
        </header>

        <!-- PANE 2: Input Pane -->
        <section class="pane input-pane">
            <div class="input-form-wrapper">
                <button id="micBtn" class="mic-btn" aria-label="Voice Input" title="Speak your question">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                <input type="text" id="userInput" placeholder="Ask Dr Leon a question..." autocomplete="off">
                <button id="stopAudioBtn" class="stop-audio-btn" aria-label="Stop Speaking" title="Stop Dr Leon speaking">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                </button>
                <button id="submitBtn" class="submit-btn" aria-label="Submit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
            <div class="listening-indicator" id="listeningIndicator" style="display: none;">Listening... Speak now</div>
        </section>

        <!-- PANE 3: Avatar Pane -->
        <section class="pane avatar-pane">
            <div class="avatar-wrapper">
                <!-- Live Simli Stream -->
                <video id="simli-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: contain; z-index: 2; position: absolute; top: 0; left: 0; border-radius: inherit;"></video>
                
                <!-- Pre-recorded FAQ Video -->
                <video id="faq-video" playsinline webkit-playsinline style="width: 100%; height: 100%; object-fit: cover; z-index: 3; position: absolute; top: 0; left: 0; border-radius: inherit; display: none;"></video>
                
                <!-- Audio Mode Still Image -->
                <img id="default-avatar-img" src="assets/images/Default-image.jpg" alt="Dr. Leon" style="width: 100%; height: 100%; object-fit: cover; z-index: 2; position: absolute; top: 0; left: 0; border-radius: inherit; display: none;">
                
                <audio id="simli-audio" autoplay playsinline controls style="position: absolute; bottom: 10px; left: 10px; width: 40px; height: 20px; opacity: 0.1; z-index: 5;"></audio>
                
                <div class="avatar-glow"></div>
            </div>
        </section>

        <!-- PANE 4: Graphics Pane (Updated Header & 20 Abbreviated FAQ Buttons) -->
        <section class="pane graphics-pane" id="graphicsPane">
            <div class="topic-box-wrapper">
                <div class="topic-menu-label">Frequently Asked Questions</div>
                <div class="topic-pills" id="topicPills">
                    <!-- Populated dynamically or statically from faqs.json -->
                </div>
            </div>
        </section>

    </div>

    <!-- Fuse.js for smart fuzzy matching -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script type="module" src="js/script.js?v=7.0"></script>
</body>
</html>
