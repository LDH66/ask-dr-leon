<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Dr. Leon | Vibe Coding AI Platform</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Simli WebRTC SDK -->
    <script src="https://cdn.jsdelivr.net/npm/simli-client@latest/dist/simli-client.js"></script>
    <!-- Fuse.js for Local Fuzzy FAQ Matching -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</head>
<body>

    <div class="app-container">
        
        <!-- PANE 1: Title Pane -->
        <header class="title-pane">
            <div class="logo-area">
                <div class="status-dot"></div>
                <h1>Ask Dr. Leon</h1>
            </div>
            <button id="voice-toggle-btn" class="voice-toggle-btn pill-btn leon-active">Video Mode</button>
            <button class="menu-btn" aria-label="Menu">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>

        <!-- PANE 2: Input Pane -->
        <section class="input-pane">
            <div class="input-form-wrapper">
                <button id="mic-btn" class="mic-btn" title="Voice Input">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18.5V23M8 23h8"></path></svg>
                </button>
                <input type="text" id="prompt-input" placeholder="Ask about Vibe Coding, assets, or media workflows..." />
                <button id="stop-audio-btn" class="stop-audio-btn" title="Stop Audio" style="display:none;">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
                <button id="submit-btn" class="submit-btn" title="Send">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
                </button>
            </div>
            <div id="listening-indicator" class="listening-indicator" style="display:none;">Listening to your microphone...</div>
        </section>

        <!-- PANE 3: Avatar Pane -->
        <section class="avatar-pane">
            <div class="avatar-wrapper">
                <!-- Static FAQ Video Player (Used for instant matching) -->
                <video id="faq-video" playsinline webkit-playsinline style="width:100%; height:100%; object-fit:cover; display:none;"></video>
                
                <!-- Live Simli WebRTC Stream Elements -->
                <video id="simli-video" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
                <audio id="simli-audio" autoplay></audio>

                <div class="avatar-glow"></div>
            </div>
        </section>

        <!-- PANE 4: Graphics / FAQ Pane -->
        <section class="graphics-pane">
            <div class="topic-menu-label">Quick FAQ Topics</div>
            <div id="topic-pills" class="topic-pills">
                <!-- Hardcoded FAQ Pills to guarantee visibility -->
                <button class="pill-btn primary" data-faq-id="faq_01">What is Vibe Coding?</button>
                <button class="pill-btn" data-faq-id="faq_02">Netlify Serverless Setup</button>
                <button class="pill-btn" data-faq-id="faq_03">Fish Audio Cloned Voice</button>
                <button class="pill-btn" data-faq-id="faq_04">Simli WebRTC Stream</button>
                <button class="pill-btn" data-faq-id="faq_05">Fuse.js Fuzzy Matching</button>
                <button class="pill-btn" data-faq-id="faq_06">Media Production Workflow</button>
            </div>
        </section>

    </div>

    <!-- Main Client Application Script -->
    <script src="js/script.js?v=7.1"></script>
</body>
</html>
